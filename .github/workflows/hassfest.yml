name: Hassfest

# Home Assistant's own integration linter. The HACS default store requires a
# custom component to pass it, and it is also the thing that notices when a
# manifest key, a service definition or a translation drifts out of the shape
# core expects.

on:
  push:
  pull_request:
  schedule:
    # Daily: hassfest tracks core, so a rule can tighten without a commit here.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Neither validation writes anything - they read the repo and report.
permissions:
  contents: read

jobs:
  validate:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
