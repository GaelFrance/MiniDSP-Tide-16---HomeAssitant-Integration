              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tide16_shutdown
          - type: button
            name: Reboot
            icon: mdi:restart
            entity: button.tide16_reboot
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tide16_reboot
          - type: button
            name: BT Pair
            icon: mdi:bluetooth
            entity: button.tide16_bluetooth_pair
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tide16_bluetooth_pair
